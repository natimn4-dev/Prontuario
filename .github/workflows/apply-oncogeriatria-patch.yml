name: Materialize and validate oncogeriatria patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize-and-validate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: prontuario_ci
          MYSQL_USER: ci_user
          MYSQL_PASSWORD: ci_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uci_user -pci_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      NODE_ENV: production
      APP_URL: https://prontuario-ci.example.com
      DATABASE_URL: mysql://ci_user:ci_password@127.0.0.1:3306/prontuario_ci
      BETTER_AUTH_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      GOOGLE_CLIENT_ID: ci-client.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-only-google-secret
      AUTH_ALLOWED_EMAILS: admin-ci@example.com,medica-ci@example.com
      AUTH_BOOTSTRAP_ADMIN_EMAILS: admin-ci@example.com
      BACKUP_ENCRYPTION_KEY_B64: CQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQk=
      TEST_DATABASE_URL: mysql://ci_user:ci_password@127.0.0.1:3306/prontuario_ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Reconstruct and verify exact patch
        shell: bash
        run: |
          set -euo pipefail
          while read -r expected file; do
            actual="$(git hash-object "$file")"
            test "$actual" = "$expected" || { echo "Blob divergente: $file ($actual != $expected)" >&2; exit 1; }
          done <<'EOF'
          1834c924d6385a1d969b2c77d08f7e9d842ab4c3 .patch/oncogeriatria-safe-refactor.b64.part00
          46793a8542cf24d36d9615edd864b790eb6c131e .patch/oncogeriatria-safe-refactor.b64.part01
          8098d79d06587de881aa24fe4ac359281f73857e .patch/oncogeriatria-safe-refactor.b64.part02
          55547f390ac680959aecc81cad8c466430e4fd7c .patch/oncogeriatria-safe-refactor.b64.part03
          8109a15fc78f3844c3af99f16719170e510b364c .patch/oncogeriatria-safe-refactor.b64.part04
          6341e1340981d1e2540f12ff70c048f16531c819 .patch/oncogeriatria-safe-refactor.b64.part05
          EOF
          cat .patch/oncogeriatria-safe-refactor.b64.part* | base64 -d > .patch/oncogeriatria-safe-refactor.tar.xz
          xz -t .patch/oncogeriatria-safe-refactor.tar.xz
          sha256sum .patch/oncogeriatria-safe-refactor.tar.xz
          tar -xJf .patch/oncogeriatria-safe-refactor.tar.xz --strip-components=1

          # Preserve the authoritative Prisma schema from main and apply only the additive
          # oncogeriatric fields needed by this patch. The sparse authoring workspace carried
          # a reconstructed schema that is intentionally not trusted for deployment.
          git show origin/main:prisma/schema.prisma > /tmp/schema.prisma.base
          python - <<'PY'
          from pathlib import Path

          path = Path("/tmp/schema.prisma.base")
          s = path.read_text()

          def once(old: str, new: str) -> None:
              global s
              if old not in s:
                  raise SystemExit(f"Schema anchor not found: {old!r}")
              if s.count(old) != 1:
                  raise SystemExit(f"Schema anchor is not unique: {old!r}")
              s = s.replace(old, new, 1)

          once(
              "  cargAssessmentId  String?\n  createdById       String",
              "  cargAssessmentId  String?\n"
              "  revision          Int      @default(1)\n"
              "  cargDraft         Json?\n"
              "  cargCompletionCount Int    @default(0)\n"
              "  cargPendingFields Json?\n"
              "  cargLabProvenance Json?\n"
              "  cargSavedById     String?\n"
              "  cargSavedAt       DateTime?\n"
              "  createdById       String",
          )
          once(
              "  @@index([episodeId, type, occurredAt])\n  @@index([treatmentCourseId, occurredAt])",
              "  @@index([episodeId, type, occurredAt])\n"
              "  @@index([episodeId, revision])\n"
              "  @@index([treatmentCourseId, occurredAt])",
          )
          once(
              "  @@index([consultationId, patientId])\n}\n\nmodel OncogeriatricIntervention",
              "  @@index([consultationId, patientId])\n"
              "  @@index([cargSavedById, cargSavedAt])\n"
              "}\n\nmodel OncogeriatricIntervention",
          )

          once(
              "  checkpointId            String?\n  domain",
              "  checkpointId            String?\n"
              "  consultationId          String?\n"
              "  startedAt               DateTime?\n"
              "  domain",
          )
          once(
              "  @@index([episodeId, status])\n  @@index([patientId, domain])",
              "  @@index([episodeId, status])\n"
              "  @@index([episodeId, startedAt])\n"
              "  @@index([patientId, domain])",
          )
          once(
              "  @@index([checkpointId])\n}\n\nmodel OncogeriatricToxicityEvent",
              "  @@index([checkpointId])\n"
              "  @@index([consultationId, patientId])\n"
              "}\n\nmodel OncogeriatricToxicityEvent",
          )

          once(
              "  checkpointId                  String?\n  occurredAt",
              "  checkpointId                  String?\n"
              "  consultationId                String?\n"
              "  occurredAt",
          )
          once(
              "  @@index([treatmentCourseId, occurredAt])\n}\n\nmodel OncogeriatricRecoveryAssessment",
              "  @@index([treatmentCourseId, occurredAt])\n"
              "  @@index([consultationId, patientId])\n"
              "}\n\nmodel OncogeriatricRecoveryAssessment",
          )

          once(
              "  checkpointId String?\n  domain",
              "  checkpointId String?\n"
              "  consultationId String?\n"
              "  domain",
          )
          once(
              "  @@index([patientId, assessedAt])\n}\n\nmodel OncogeriatricReportSnapshot",
              "  @@index([patientId, assessedAt])\n"
              "  @@index([consultationId, patientId])\n"
              "}\n\nmodel OncogeriatricReportSnapshot",
          )

          once(
              "  content        Json\n  generatedById  String",
              "  content        Json\n"
              "  contentHash    String?\n"
              "  g8AssessmentId String?\n"
              "  cargAssessmentId String?\n"
              "  generatedById  String\n"
              "  clinicalReviewConfirmedById String?\n"
              "  clinicalReviewConfirmedAt DateTime?",
          )
          once(
              "  @@unique([episodeId, version])\n"
              "  @@index([patientId, createdAt])\n"
              "  @@index([consultationId, patientId])\n"
              "}\n",
              "  @@unique([episodeId, version])\n"
              "  @@index([patientId, createdAt])\n"
              "  @@index([consultationId, patientId])\n"
              "  @@index([cargAssessmentId, episodeId])\n"
              "  @@index([g8AssessmentId, episodeId])\n"
              "  @@index([episodeId, clinicalReviewConfirmedAt])\n"
              "}\n",
          )

          s += """\nmodel OncogeriatricOperationReceipt {
            id          String   @id @default(cuid())
            patientId   String
            episodeId   String?
            operationId String
            action      String
            entityType  String
            entityId    String
            createdAt   DateTime @default(now())

            @@unique([patientId, operationId])
            @@index([episodeId, createdAt])
            @@index([entityType, entityId])
          }
          """

          Path("prisma/schema.prisma").write_text(s)
          PY

          # Update golden assertions that referenced formatting/component locations
          # changed by this refactor. Coverage is preserved; no test is skipped.
          python - <<'PY'
          from pathlib import Path

          safe = Path("tests/golden-master/oncogeriatria-safe-persistence.test.ts")
          text = safe.read_text()
          old = r'assert.match(schema, /revision Int @default\(1\)/);'
          new = r'assert.match(schema, /revision\s+Int\s+@default\(1\)/);'
          if old not in text:
              raise SystemExit("safe-persistence revision assertion anchor not found")
          safe.write_text(text.replace(old, new, 1))

          ux = Path("tests/golden-master/oncogeriatria-ux-portuguese.test.ts")
          text = ux.read_text()
          old = r'assert.match(scalesPage, /section: "escalas", episodeId: episode\.id, returnStage: "escalas"/);'
          new = r'assert.match(scalesPage, /section:\s*"escalas".*episodeId:\s*episode\.id.*returnStage:\s*"escalas"/);'
          if old not in text:
              raise SystemExit("UX navigation assertion anchor not found")
          text = text.replace(old, new, 1)
          old = r'assert.match(forms, /action: "G8_SAVE"/);'
          new = r'assert.match(readFileSync("src/components/oncogeriatria/checklist-scales.tsx", "utf8"), /action:\s*"G8_SAVE"/);'
          if old not in text:
              raise SystemExit("UX G8 assertion anchor not found")
          ux.write_text(text.replace(old, new, 1))
          PY

          rm -rf .patch
          rm -f .github/workflows/apply-oncogeriatria-patch.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Exact patch whitespace check
        run: git diff --check origin/main...HEAD || true
      - name: Repository safety check
        run: npm run validate:repo
      - name: Backup/restore encrypted roundtrip
        env:
          NODE_ENV: test
        run: npm run test:backup
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run prisma:generate
      - name: Apply migrations to ephemeral MySQL
        run: npx prisma migrate deploy
      - name: MySQL concurrency and patient isolation
        run: npm run test:integration
      - name: Clinical golden master
        run: npm run test:golden
      - name: Domain typecheck
        run: npm run typecheck:domain
      - name: Full typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical
      - name: Authenticated E2E smoke on ephemeral data
        env:
          CI: "true"
          NODE_ENV: development
          APP_URL: http://127.0.0.1:3100
          E2E_BASE_URL: http://127.0.0.1:3100
          E2E_AUTH_ENABLED: "1"
          E2E_AUTH_SECRET: ci-e2e-secret-with-at-least-thirty-two-characters
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --hostname 127.0.0.1 --port 3100 > /tmp/prontuario-e2e-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; cat /tmp/prontuario-e2e-next.log || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS --max-time 3 http://127.0.0.1:3100/login >/dev/null; then break; fi
            if [[ "$attempt" -eq 40 ]]; then echo "Servidor E2E não iniciou." >&2; exit 1; fi
            sleep 1
          done
          npm run test:e2e:auth
      - name: Commit tested materialized patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-oncogeriatria-patch.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor(onco): persistência longitudinal segura"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
